services:
  frontend:
    build:
      context: .
      args:
        # Baked into the client bundle at build time — change requires a rebuild
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    container_name: course-qa-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - path: .env.local
        required: false
